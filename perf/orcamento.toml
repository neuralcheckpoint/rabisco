# Orçamento da suíte de performance (docs/src/06-performance.md).
# A suíte reprova se a MEDIANA passar daqui. Tempos com folga de ~2x sobre a
# mediana de 2026-11-07 (a máquina costuma ter outro job rodando); alocação e
# tamanho são determinísticos, então a folga é pequena.
# Tela do Rafa: 6400x2160 físicos (4K + 1440p). Em outra tela, os tempos e a
# memória do modo desenho mudam.

[tempo]
preencher_ms = 8           # hoje 3,2-3,9
refazer_200_ms = 30        # hoje 15,7-16,4 (era 81,6 antes das faixas em paralelo)
fade_quadro_ms = 5         # hoje 0,3 (era 2,9 antes da camada-base, 0.3.1)
traco_amostra_us = 5       # hoje 2,0
texto_tecla_ms = 1         # hoje 0,47
holofote_mover_us = 80     # hoje 40
holofote_ligar_ms = 4      # hoje 1,4-1,6
png_codificar_ms = 80      # hoje 40 (era 198 numa thread só)
png_decodificar_ms = 120   # hoje 71-73 (era 203)
# Casos pesados do QA com personas (0.3.1): 1.000 traços, texto longo, furo grande.
fade_1000_quadro_ms = 16   # hoje 8,0-9,1 com 50 sumindo juntos (era 289: refazia os 1.000 fixos a cada quadro)
texto_2000_tecla_ms = 4    # hoje ~1,1-2,0 (era 11,7: quebra quadrática + GDI da caixa toda)
borracha_999_amostra_us = 100  # hoje 35-41 (era 2.170: segmentos de todos os traços)
holofote_900_furo_ms = 15  # hoje ~9 (era 23: sem o espelho do quadrante)

[alocacao]
# Bytes pedidos ao alocador por evento, depois do aquecimento.
fade_quadro_bytes = 140_000    # hoje 121.293: blocos + camada-base (16 KB por bloco 64x64), uma vez por fade (era 31.350 sem a base)
traco_amostra_bytes = 1_200    # hoje 1.011: bloco novo de 20 KB quando a caneta entra nele + a lista de pontos
texto_tecla_bytes = 100_000    # hoje 84.930: a cobertura nova do texto (GDI) a cada tecla
holofote_mover_bytes = 0       # não aloca
png_kb = 2_800                 # tamanho do PNG da tela de teste; hoje 2.637 KB

[processo]
exe_bytes = 567_296            # 0.4.8 (561.664): +19 KB dos atalhos configuráveis (arquivo, parser, menus montados na hora). Antes: 548.864, 0.4.6 (542.720): +5 KB de print de região, moldura e etiqueta GDI da gravação. Antes: 541.696, 0.4.0-a (500.736) + 40 KB, o teto do E2 (áudio, menu, escolha da janela e da região, contador). Antes: 504.000; ~492 KB; 500.736 (446.976 na 0.3.1: +52,5 KB da gravação: interfaces do crate windows, motor, --gravar e --gravar-teste). Antes: 440 KB; ~447.000 (430.592 na 0.3.0: +16 KB de fila do print, camada-base e faixas do fade, texto por linha)
# Memória privada (KB) do rabisco.exe --perf-memoria em cada estado.
memoria_mouse_parado_privado_kb = 2_048        # hoje 1.708-1.716 (antes do boot de 07/11 à tarde: 2.004-2.012, e o c12c0c7 igual: 2.000-2.052)
# Em 2026-11-07 (tarde) o dcfc411 medido de novo deu 59.312 / 59.728 / 5.792 /
# 5.696 KB nos quatro de baixo: a máquina mudou (telas/driver), não o código.
memoria_desenho_vazio_privado_kb = 62_000      # hoje 59.128-59.188 (a imagem da tela: 52,7 MB); era 55.908
memoria_desenho_200_privado_kb = 63_000        # hoje 59.540-60.972; era 56.216
memoria_desenho_8s_privado_kb = 9_000          # hoje 2.200-2.304 depois do boot; antes oscilava 2.2 ou 6-7.7 MB no mesmo c12c0c7 (ver 06-performance)
memoria_mouse_200_privado_kb = 9_000           # hoje 5.556-5.696; era 2.132-2.240 (o dcfc411 hoje: 5.696)
memoria_holofote_ligado_privado_kb = 42_000    # hoje 20.496-20.632: só o monitor escurecido (1440p, o do cursor; num 4K, ~39 MB). Era 74.440-74.940 com a imagem da tela inteira (0.4.1)
memoria_holofote_desligado_privado_kb = 9_000  # hoje 5.468-6.188 (era 59.372-60.372: a imagem da tela ficava até o IDLE_TIMER)
memoria_mouse_fim_privado_kb = 9_000           # hoje 5.908-6.412 (ver pendência do holofote)
memoria_mouse_fim_3x_privado_kb = 9_000        # hoje 5.664-6.640: não cresce a cada volta
# A gravação roda em outro processo (rabisco.exe --gravar): este não cresce.
memoria_gravando_privado_kb = 2_300            # hoje 1.716; medido logo depois do mouse_parado (o teste também exige gravou <= 1,1x parado)
memoria_gravou_privado_kb = 2_300              # hoje 1.744-1.756 (1,02x o parado)
# Região pelo menu: a tela escurecida do monitor do cursor existe só enquanto escolhe.
memoria_escolhendo_regiao_privado_kb = 40_000  # hoje 16.204 no monitor de 1440p (o do cursor); num 4K, ~34 MB
memoria_gravou_regiao_privado_kb = 2_300       # hoje 1.660: a imagem saiu junto com a escolha

[gravacao]
# --gravar-teste de 30 s (o processo da gravação), regiões no monitor 4K. RTX 3090 (NVENC).
gravar_1080p_cpu_pct = 10          # hoje 3,0-4,8% de um núcleo (meta < 5%); folga para outro job na máquina
gravar_4k_cpu_pct = 10             # hoje 4,2%
gravar_1080p_privado_pico_kb = 220_000   # hoje 119.096-119.532: driver da NVIDIA + MF; volta ao sistema quando o processo sai
gravar_4k_privado_pico_kb = 480_000      # hoje 231.776 (com a CPU a 100% de outro job, antes do boot: até 411 MB)
gravar_perdidos_pct = 2            # hoje 0 (antes da prioridade alta da thread: 20-65% com a CPU cheia)
gravar_inicio_ms = 6_000           # hoje 357-373 ms; antes do boot, com a máquina carregada, 1,5-4,8 s
gravar_parada_ms = 2_500           # hoje 4-6 ms; com a máquina carregada, até 1,46 s
# 10 s de 1080p30 com o som do sistema (WASAPI loopback + AAC 160 kbps, 0.4.0).
gravar_1080p_som_cpu_pct = 12      # hoje: ver 06-performance
gravar_1080p_som_privado_pico_kb = 230_000
gravar_som_desvio_ms = 30          # a fila corrige acima de 10 ms; o pacote do WASAPI tem ~10 ms
