[package]
name = "rabisco"
version = "0.1.0"
edition = "2024"
description = "Anotar por cima da tela no Windows, estilo Epic Pen. Rust puro, Win32."
license = "MIT"
repository = "https://github.com/neuralcheckpoint/rabisco"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
