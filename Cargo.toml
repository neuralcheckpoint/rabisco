[package]
name = "rabisco"
version = "0.4.7"
edition = "2024"
description = "Anotar por cima da tela no Windows, estilo Epic Pen. Rust puro, Win32."
license = "MIT"
repository = "https://github.com/neuralcheckpoint/rabisco"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Só para a gravação (src/gravar_gpu.rs, src/gravar_som.rs): as interfaces COM/WinRT
# do D3D11, do WGC, do Media Foundation e do WASAPI. As funções das DLLs vêm por LoadLibrary.
[dependencies.windows]
version = "0.62"
default-features = false
features = [
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Só os testes (tests/gravar.rs): o tom de teste pelo PlaySound. Não entra no exe.
[dev-dependencies.windows-sys]
version = "0.61"
features = ["Win32_Media", "Win32_Media_Audio"]
